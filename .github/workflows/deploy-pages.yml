name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Static export. This repo is a GitHub Pages USER site
      # (https://gtnn12.github.io/), which is served from the root — assets must
      # use base "/" (no /<repo>/ prefix).
      - run: bun run build:static
        env:
          GHP_BASE: "/"

      # TanStack Start's static export writes index.html and the assets into
      # dist/client. Publish exactly that directory so index.html sits at the
      # root of the Pages artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
